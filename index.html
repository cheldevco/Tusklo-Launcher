<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Tusklo Launcher</title>
<style>
@font-face{font-family:"MC";src:url("assets/minecraft.ttf") format("truetype");font-display:block}
:root{
  --bg:#1e1e1f;--panel:#313233;--panel2:#3a3b3c;--line:#48494a;
  --text:#fff;--dim:#b1b2b5;
  --g:#3c8527;--gl:#52a535;--gd:#2a641c;--red:#d9453a;
  --font:"MC","Noto Sans","Segoe UI",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.35 var(--font);overflow:hidden;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gl);outline-offset:2px}
.app{display:flex;flex:1;min-height:0}

/* своя панель окна */
.tb{height:36px;flex:none;background:#171718;border-bottom:1px solid #000;display:flex;align-items:center;gap:10px;padding-left:12px;-webkit-app-region:drag;user-select:none}
.tb .cube{width:18px;height:18px}
.tt{flex:1;color:var(--dim);letter-spacing:1px}
.wb{-webkit-app-region:no-drag;width:46px;height:36px;border:0;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center}
.wb:hover{background:#2c2d2e;color:#fff}
.wb.x:hover{background:#c42b1c}
.wb svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}

/* левая колонка */
.side{width:220px;background:#171718;border-right:1px solid #000;display:flex;flex-direction:column}
.ed{display:flex;align-items:center;gap:10px;background:none;border:0;border-left:4px solid transparent;padding:12px;text-align:left;cursor:pointer;color:var(--dim);width:100%}
.ed:hover{background:#232324;color:var(--text)}
.ed.on{background:#232324;color:var(--text);border-left-color:var(--gl)}
.ed small{display:block;font-size:16px;color:var(--dim)}
.cube{flex:none;width:30px;height:30px;background:linear-gradient(#5f9a45 0 32%,#7a5436 32%);box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 3px 3px 0 rgba(255,255,255,.14)}
.grow{flex:1}
.acc{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;padding:12px;border-top:1px solid #000}
.avatar{display:block;width:30px;height:30px;flex:none;object-fit:cover;image-rendering:pixelated;background:linear-gradient(#8a5a3c 0 45%,#4b3626 45%);border:1px solid #050505;box-shadow:inset 0 -6px 0 #2f6fbb}
.account-avatar{width:34px;height:34px}
.account-label{min-width:0;overflow:hidden}
.account-label b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc b{display:block;overflow:hidden;text-overflow:ellipsis}.acc small{color:var(--dim);font-size:14px}
.acc select{grid-column:1/-1;width:100%;min-width:0;padding:6px;background:var(--panel2);border:2px solid #000;font-size:14px}

/* основное */
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.top{background:var(--panel);border-bottom:1px solid #000;display:flex;justify-content:center;gap:6px}
.tab{background:none;border:0;padding:14px 22px;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--gl)}
.views{flex:1;overflow:auto;position:relative}
.view{display:none;min-height:100%}.view.on{display:block}

/* Играть */
#v-play{position:relative;background:#0b0d12 center/cover no-repeat}
#v-play:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.34),transparent 32%,transparent 60%,rgba(0,0,0,.5))}
.logo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0;text-align:center;padding:4vh 18px 0}
.minecraft-wordmark{display:block;width:min(54vw,520px);height:auto;object-fit:contain;filter:drop-shadow(0 5px 2px rgba(0,0,0,.48))}
.edition-wordmark{display:block;width:min(29vw,270px);height:auto;margin-top:-17px;object-fit:contain;filter:drop-shadow(0 3px 1px rgba(0,0,0,.55))}

/* нижняя панель */
.bar{height:92px;flex:none;background:var(--panel);border-top:1px solid #000;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;gap:16px}
.sel select{width:260px;max-width:100%;background:#1e1e1f;border:2px solid #000;padding:9px 10px;cursor:pointer}
.sel label{display:block;color:var(--dim);margin-bottom:3px}
.play{min-width:260px;padding:10px 24px;position:relative;isolation:isolate;border:0;background:#080808;--pixel-fill:var(--g);cursor:pointer;clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));text-align:center}
.play::before{content:"";position:absolute;z-index:-1;inset:2px;pointer-events:none;background:var(--pixel-fill);clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));box-shadow:inset 0 3px 0 var(--gl),inset 0 -4px 0 var(--gd)}
.play b{display:block;font-size:24px;font-weight:400;letter-spacing:2px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.play small{display:block;color:#d5e9cd}
.play:hover:not(:disabled){--pixel-fill:#46992f}
.play:active:not(:disabled){padding-top:12px}
.play:active:not(:disabled)::before{box-shadow:inset 0 -2px 0 var(--gd),inset 0 2px 0 var(--gl)}
.play:disabled{filter:grayscale(.5) brightness(.8);cursor:wait}
.prog{justify-self:end;width:260px;max-width:100%;color:var(--dim)}
.pbar{height:8px;background:#111;border:1px solid #000;margin-bottom:5px}
.pbar i{display:block;height:100%;width:0;background:var(--gl);transition:width .15s}
#log{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* общие */
.pad{padding:24px 32px}
h2{font-size:24px;font-weight:400;margin-bottom:16px}
.btn{position:relative;isolation:isolate;background:#080808;--pixel-fill:var(--panel2);border:0;padding:8px 16px;cursor:pointer;clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
.btn::before,.seg button::before{content:"";position:absolute;z-index:-1;inset:2px;pointer-events:none;background:var(--pixel-fill);clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.35)}
.btn:hover{--pixel-fill:#4a4b4c}
.btn.g{--pixel-fill:var(--g)}
.btn.g::before{box-shadow:inset 0 2px 0 var(--gl),inset 0 -3px 0 var(--gd)}
.btn.g:hover{--pixel-fill:#46992f}
.btn:disabled{opacity:.55;cursor:wait}
input[type=text],input[type=password],input[type=number],.field select{width:100%;background:#1e1e1f;border:2px solid #000;padding:8px 10px}
label{display:block;color:var(--dim);margin-bottom:4px}
.hint{color:var(--dim);margin-top:4px}.hint a{color:var(--gl)}
.chk{display:inline-flex;gap:8px;align-items:center;margin:6px 14px 0 0;color:var(--dim)}
.chk.s{color:var(--text);margin:0}
.chk input{width:18px;height:18px;accent-color:var(--gl)}

/* установки */
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:12px 14px;background:var(--panel);border:2px solid #000;margin-bottom:8px}
.row.cur{border-color:var(--gl)}
.row .cube{width:44px;height:44px}
.row small{color:var(--dim);display:block;font-size:16px}
.act{display:flex;gap:8px;align-items:center}
.mini{width:140px}.mini .pbar{margin:0}
.ok{color:var(--gl)}
dialog{margin:auto;background:var(--panel);color:var(--text);border:2px solid #000;padding:22px;width:420px;max-width:92vw}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog .field{margin-bottom:14px}
.dlg-act{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.dialog-wide{width:620px;max-height:86vh;overflow:auto}
.dialog-wide h2{margin-bottom:12px}
.dialog-wide p{color:var(--dim);margin-bottom:12px}
.account-list{display:grid;gap:8px;margin:8px 0 14px}
.account-item{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--panel);padding:9px;border:2px solid #000}
.account-item small{display:block;color:var(--dim)}
.account-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.account-add input{width:100%}
.welcome-dialog{width:500px}
.welcome-actions{display:grid;gap:10px;margin:16px 0}
.welcome-actions .btn{width:100%;padding:12px}
.error-text{color:#ff8a80;min-height:20px;font-size:14px}
.crash-dialog{width:720px;max-height:88vh;overflow:auto}
.crash-mod{display:flex;justify-content:space-between;gap:12px;padding:9px;background:var(--panel);border:2px solid #000;margin:7px 0}
.crash-mod small{display:block;color:var(--dim)}
.crash-log{margin-top:12px}
.crash-log summary{cursor:pointer;color:var(--dim);padding:8px 0}
.crash-log pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#111;padding:12px;max-height:190px;overflow:auto;font:12px/1.4 Consolas,monospace;color:#ddd}
.repair-result{padding:9px 0;color:var(--dim)}
@media(max-width:700px){.account-item{grid-template-columns:36px minmax(0,1fr) auto}.account-item .remove-account{grid-column:3}.account-add{grid-template-columns:1fr}.crash-dialog{width:94vw}}

/* моды */
.sbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.sbar input{flex:1;min-width:160px}
.seg{display:flex}
.seg button{position:relative;isolation:isolate;background:#080808;--pixel-fill:var(--panel2);border:0;padding:8px 14px;cursor:pointer;color:var(--dim);clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
.seg button.on[data-k]{--pixel-fill:var(--g);color:#fff}
.seg button.on[data-s=modrinth]{--pixel-fill:#1bd96a;color:#04200f}
.seg button.on[data-s=curseforge]{--pixel-fill:#f16436;color:#2a0c02}
.layout{display:grid;grid-template-columns:1fr 240px;gap:20px;align-items:start}
.mod{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px;background:var(--panel);border:2px solid #000;margin-bottom:8px}
.mod img,.ph{width:56px;height:56px;background:#1e1e1f;object-fit:cover}
.mod h3{font-size:16px;font-weight:400}
.mod p{color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--dim)}
.sidebox{background:var(--panel);border:2px solid #000;padding:14px;position:sticky;top:0}
.sidebox h3{font-size:16px;font-weight:400;margin-bottom:8px}
.inst{display:flex;justify-content:space-between;gap:6px;padding:4px 0;word-break:break-all}
.inst button{background:none;border:0;color:var(--red);cursor:pointer}
.empty{color:var(--dim);padding:24px 0}
.form{max-width:480px;display:grid;gap:18px}
.toast{position:fixed;right:20px;bottom:110px;background:var(--panel2);border:2px solid #000;border-left:5px solid var(--gl);padding:12px 16px;max-width:360px;display:none;z-index:9}
.toast.err{border-left-color:var(--red)}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.sidebox{position:static}.bar{grid-template-columns:1fr auto}.prog{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="tb">
  <span class="cube"></span><span class="tt">TUSKLO LAUNCHER</span>
  <button class="wb" data-w="min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button>
  <button class="wb" data-w="max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button>
  <button class="wb x" data-w="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11"/></svg></button>
</div>

<div class="app">
  <aside class="side">
    <button class="ed on" id="edJava"><span class="cube"></span><span>Minecraft<small>Java Edition</small></span></button>
    <div class="grow"></div>
    <button class="ed" id="edSet"><span style="width:30px;text-align:center">⚙</span><span data-i="settings"></span></button>
    <div class="acc"><img class="avatar" id="headAvatar" alt="Minecraft avatar"><div><b id="who">—</b><small id="mode"></small></div>
      <select id="accountSelect" aria-label="Выбрать аккаунт"></select></div>
  </aside>

  <div class="content">
    <header class="top">
      <button class="tab on" data-v="play" data-i="play"></button>
      <button class="tab" data-v="inst" data-i="inst"></button>
      <button class="tab" data-v="mods" data-i="mods"></button>
    </header>

    <div class="views">
      <div class="view on" id="v-play"><div class="logo" aria-label="Minecraft Java Edition">
        <img class="minecraft-wordmark" src="assets/minecraft-logo.png" alt="Minecraft">
        <img class="edition-wordmark" src="assets/java-edition.png" alt="Java Edition">
      </div></div>

      <div class="view" id="v-inst"><div class="pad">
        <div class="head"><h2 style="margin:0" data-i="inst"></h2><button class="btn g" id="newInst" data-i="newInst"></button></div>
        <div id="instList"></div>
      </div></div>

      <div class="view" id="v-mods"><div class="pad">
        <h2><span id="kt"></span>: <span id="ctx"></span></h2>
        <div class="sbar">
          <div class="seg" id="kind"><button data-k="mod" class="on" data-i="modsT"></button><button data-k="resourcepack" data-i="packsT"></button></div>
          <div class="seg" id="seg"><button data-s="modrinth" class="on">Modrinth</button><button data-s="curseforge">CurseForge</button></div>
          <input type="text" id="q">
          <button class="btn g" id="sbtn" data-i="find"></button>
        </div>
        <div class="layout">
          <div id="res"></div>
          <aside class="sidebox"><h3 data-i="installedH"></h3><div id="modInst"></div>
            <button class="btn" style="margin-top:10px;width:100%" id="open" data-i="openFolder"></button></aside>
        </div>
      </div></div>

      <div class="view" id="v-set"><div class="pad">
        <h2 data-i="settings"></h2>
        <div class="form">
          <div class="field"><label for="lang" data-i="language"></label>
            <select id="lang"><option value="ru">Русский</option><option value="en">English</option><option value="uk">Українська</option></select>
            <div class="hint" data-i="langHint"></div></div>
          <div><label class="chk s"><input type="checkbox" id="closeOn"><span data-i="closeOn"></span></label>
            <div class="hint" data-i="closeHint"></div></div>
          <div class="field">
            <label data-i="accountManager"></label>
            <div class="account-list" id="accountsList"></div>
            <div class="hint" data-i="msHint"></div>
            <button class="btn g" id="ms" style="margin-top:10px" data-i="addMicrosoft"></button>
          </div>
          <div class="field">
            <label for="nick" data-i="offNick"></label>
            <div class="account-add"><input type="text" id="nick" maxlength="16" placeholder="Steve_123">
              <button class="btn" id="off" data-i="addOffline"></button></div>
            <div class="hint" data-i="offHint"></div>
          </div>
          <div class="field"><label for="ram" data-i="ram"></label><input type="number" id="ram" min="1" max="32"></div>
          <div class="field"><label for="jp" data-i="javaPreset"></label>
            <select id="jp"><option value="default" data-i="pDefault"></option><option value="optimize" data-i="pOpt"></option><option value="mods" data-i="pMods"></option><option value="lowend" data-i="pLow"></option><option value="custom" data-i="pCustom"></option></select>
            <div class="hint" id="jpd"></div></div>
          <div class="field"><label for="ja" data-i="javaArgs"></label><input type="text" id="ja" spellcheck="false">
            <div class="hint" data-i="javaHint"></div></div>
          <button class="btn g" id="save" data-i="save"></button>
        </div>
      </div></div>
    </div>

    <footer class="bar">
      <div class="sel"><label for="cur" data-i="installation"></label><select id="cur"></select></div>
      <button class="play" id="go"><b></b><small id="sub"></small></button>
      <div class="prog"><div class="pbar"><i id="pb"></i></div><span id="log"></span></div>
    </footer>
  </div>
</div>


<dialog id="welcomeDlg" class="welcome-dialog">
  <h2 data-i="welcomeTitle"></h2>
  <p data-i="welcomeText"></p>
  <div class="welcome-actions">
    <button class="btn g" id="welcomeMs" data-i="welcomeMicrosoft"></button>
    <div class="field">
      <label for="welcomeNick" data-i="offNick"></label>
      <input type="text" id="welcomeNick" maxlength="16" placeholder="Steve_123" style="width:100%">
      <button class="btn" id="welcomeOff" style="width:100%;margin-top:8px" data-i="welcomeOffline"></button>
    </div>
  </div>
  <div id="welcomeError" class="error-text"></div>
</dialog>

<dialog id="crashDlg" class="crash-dialog">
  <h2 data-i="crashTitle"></h2>
  <p id="crashMessage"></p>
  <div><b data-i="crashBuild"></b>: <span id="crashBuildInfo"></span></div>
  <h3 style="margin-top:14px" data-i="crashMissing"></h3>
  <div id="crashMods"></div>
  <div id="repairResult" class="repair-result"></div>
  <details class="crash-log"><summary data-i="showCrashLog"></summary><pre id="crashLog"></pre></details>
  <div class="dlg-act">
    <button class="btn" id="crashClose" data-i="closeCrash"></button>
    <button class="btn g" id="crashFix" data-i="repairBuild"></button>
  </div>
</dialog>

<dialog id="dlg">
  <h2 data-i="newInst"></h2>
  <div class="field"><label for="nName" data-i="name"></label><input type="text" id="nName"></div>
  <div class="field"><label for="nVer" data-i="version"></label><select id="nVer"></select>
    <label class="chk"><input type="checkbox" id="fSnap"><span data-i="snaps"></span></label>
    <label class="chk"><input type="checkbox" id="fOld"><span data-i="oldV"></span></label></div>
  <div class="field"><label for="nLdr" data-i="loader"></label>
    <select id="nLdr"><option value="vanilla" data-i="vanilla"></option><option value="fabric">Fabric</option><option value="quilt">Quilt</option></select></div>
  <div class="dlg-act"><button class="btn" id="nCancel" data-i="cancel"></button><button class="btn g" id="nCreate" data-i="create"></button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const I18N={

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LD={vanilla:'Vanilla',fabric:'Fabric',quilt:'Quilt'};
let S,V=[],have=new Set(),src='modrinth',kind='mod',found=[],busy=null,dlp={},searching=false,JP={};
const t=(k,v={})=>{let s=(I18N[S&&S.lang]||I18N.ru)[k]??I18N.ru[k]??k;for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
const toast=(m,e)=>{m=String(m).replace(/Error invoking remote method '[^']+': (Error: )?/,'');const el=$('#toast');el.textContent=m;el.className='toast'+(e?' err':'');el.style.display='block';clearTimeout(el._h);el._h=setTimeout(()=>el.style.display='none',4500)};
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+' '+t('mln'):n>=1e3?Math.round(n/1e3)+' '+t('thou'):n;
const cur=()=>S.installs.find(i=>i.id===S.sel)||S.installs[0];
const label=i=>`${LD[i.loader]} ${i.version}`;

/* окно */
$$('.wb').forEach(b=>b.onclick=()=>api.call('win',b.dataset.w));

/* язык */
function applyLang(){
  document.documentElement.lang=S.lang;
  $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#kt').textContent=t(kind==='mod'?'modsT':'packsT');
  $('#q').placeholder=t(kind==='mod'?'modPh':'packPh');
  who();drawAccounts();drawBar();drawInst();ctx();renderRes();listMods();jpUpdate();
}
$('#lang').onchange=async e=>{S=await api.call('set',{lang:e.target.value});applyLang();$('#log').textContent=t('ready')};
$('#closeOn').onchange=async e=>{S=await api.call('set',{closeOnLaunch:e.target.checked})};

/* аргументы JVM */
function jpUpdate(){
  const p=$('#jp').value,c=p==='custom';
  $('#jpd').textContent=t('d_'+p);$('#ja').readOnly=!c;
  $('#ja').value=c?(S.javaArgs||''):(JP[p]||'');$('#ja').placeholder=t('noArgs');
}
$('#jp').onchange=async()=>{S=await api.call('set',{javaPreset:$('#jp').value});jpUpdate()};
$('#ja').onchange=async()=>{if(!$('#ja').readOnly)S=await api.call('set',{javaArgs:$('#ja').value.trim()})};

/* навигация */
function show(v){
  $$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('#edJava').classList.toggle('on',v!=='set');$('#edSet').classList.toggle('on',v==='set');
  $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  if(v==='inst')drawInst();
  if(v==='mods'){ctx();listMods();if(!found.length)search()}
}
$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#edJava').onclick=()=>show('play');$('#edSet').onclick=()=>show('set');

function activeAccount(){return (S.accounts||[]).find(a=>a.id===S.activeAccountId)||null}
function who(){const a=activeAccount();$('#who').textContent=a?.nick||'—';$('#mode').textContent=a?.mode==='ms'?'Microsoft':a?t('offline'):t('account')}
function bindAvatar(img){
  img.classList.remove('avatar-fallback');
  img.onerror=()=>{img.onerror=null;img.classList.add('avatar-fallback')};
  img.src='assets/player-avatar.png';
}
function refreshAvatars(){
  const active=activeAccount();
  bindAvatar($('#headAvatar'));
  $$('#accountsList .account-avatar').forEach(img=>bindAvatar(img));
}
function drawAccounts(){
  const accounts=S.accounts||[];
  $('#accountSelect').innerHTML=accounts.map(a=>`<option value="${esc(a.id)}">${esc(a.nick)} · ${a.mode==='ms'?'Microsoft':t('offline')}</option>`).join('');
  $('#accountSelect').value=S.activeAccountId||'';
  $('#accountsList').innerHTML=accounts.map(a=>`<div class="account-item"><img class="avatar account-avatar" data-nick="${esc(a.nick)}" alt=""><div class="account-label"><b>${esc(a.nick)}</b><small>${a.mode==='ms'?'Microsoft':t('offline')}${a.id===S.activeAccountId?' · '+t('activeAccount'):''}</small></div>
    ${a.id===S.activeAccountId?'<span class="ok">✓</span>':`<button class="btn" data-account-select="${esc(a.id)}">${t('selectAccount')}</button>`}
    ${accounts.length>1?`<button class="btn remove-account" data-account-remove="${esc(a.id)}">✕</button>`:''}</div>`).join('')||`<div class="hint">${t('none')}</div>`;
  who();refreshAvatars();
}
function drawBar(){
  $('#cur').innerHTML=S.installs.map(i=>`<option value="${esc(i.id)}">${esc(i.name)} (${esc(label(i))})</option>`).join('');
  $('#cur').value=S.sel;
  const i=cur();$('#sub').textContent=have.has(i.version)?label(i):label(i)+' · '+t('willDl');
  $('#go b').textContent=busy==='play'?t('starting'):t('playBtn');
  $('#go').disabled=!!busy;
}
async function pick(id){S=await api.call('select',{installs:S.installs,sel:id});found=[];drawBar();drawInst()}
$('#cur').onchange=e=>pick(e.target.value);
$('#accountSelect').onchange=async e=>{
  try{S=await api.call('switchAccount',e.target.value);drawAccounts();toast(t('accountSwitched')+S.nick)}
  catch(err){toast(err.message,1)}
};
$('#accountsList').onclick=async e=>{
  const select=e.target.closest('[data-account-select]'),remove=e.target.closest('[data-account-remove]');
  try{
    if(select){S=await api.call('switchAccount',select.dataset.accountSelect);drawAccounts();toast(t('accountSwitched')+S.nick)}
    if(remove){S=await api.call('removeAccount',remove.dataset.accountRemove);drawAccounts();toast(t('accountRemoved'))}
  }catch(err){toast(err.message,1)}
};
async function addOfflineAccount(nick, firstRun=false){
  try{
    S=await api.call('createOfflineAccount',nick);$('#nick').value='';drawAccounts();
    if(firstRun)$('#welcomeDlg').close();
    toast(t('accountAdded')+S.nick);
    return true;
  }catch(err){
    if(firstRun)$('#welcomeError').textContent=t('welcomeError')+err.message;
    else toast(err.message,1);
    return false;
  }
}
async function addMicrosoftAccount(firstRun=false){
  try{
    S=await api.call('login');drawAccounts();
    if(firstRun)$('#welcomeDlg').close();
    toast(t('loggedIn')+S.nick);return true;
  }catch(err){
    if(firstRun)$('#welcomeError').textContent=t('loginFail')+err.message;
    else toast(t('loginFail')+err.message,1);
    return false;
  }
}
$('#ms').onclick=()=>addMicrosoftAccount(false);
$('#off').onclick=()=>addOfflineAccount($('#nick').value.trim(),false);
$('#welcomeMs').onclick=()=>addMicrosoftAccount(true);
$('#welcomeOff').onclick=()=>addOfflineAccount($('#welcomeNick').value.trim(),true);
$('#welcomeDlg').addEventListener('cancel',e=>e.preventDefault());

/* скачивание и запуск */
async function download(i){
  if(busy)return;busy=i.version;dlp[i.version]=0;drawBar();drawInst();
  try{await api.call('download',{id:i.version,loader:i.loader});have=new Set(await api.call('installed'));toast(t('dlDone',{v:i.version}))}
  catch(e){toast(t('dlFail')+e.message,1);throw e}
  finally{busy=null;delete dlp[i.version];$('#pb').style.width='0';drawBar();drawInst()}
}
async function play(){
  const i=cur();
  try{if(!have.has(i.version))await download(i)}catch{return}
  busy='play';drawBar();
  try{await api.call('play')}catch(e){toast(e.message,1);ended()}
}
const ended=()=>{busy=null;$('#pb').style.width='0';drawBar()};
$('#go').onclick=play;
api.on('dl',e=>{dlp[e.id]=e.done/e.total;const p=Math.round(dlp[e.id]*100);
  if(busy===e.id||e.id==='java'){$('#pb').style.width=p+'%';$('#log').textContent=e.id==='java'?t('javaProg',{p}):t('dlProg',{id:e.id,p})}
  const m=document.querySelector(`[data-p="${CSS.escape(e.id)}"]`);if(m)m.style.width=p+'%'});
api.on('progress',e=>{if(e.total)$('#pb').style.width=Math.round(e.task/e.total*100)+'%'});
api.on('log',m=>{$('#log').textContent=m.trim().split('\n').pop()});
api.on('closed',()=>{ended();$('#log').textContent=t('closed')});
function showCrashReport(report){
  ended();
  $('#log').textContent=t('crashed');
  $('#crashMessage').textContent=report.message||t('crashed');
  $('#crashBuildInfo').textContent=`${report.instance} · Minecraft ${report.version} · ${report.loader} · код: ${report.code??'—'}`;
  $('#crashMods').innerHTML=report.suggestions?.length?report.suggestions.map(m=>`<div class="crash-mod"><div><b>${esc(m.id)}</b><small>${esc(m.reason||'')}</small></div><span class="ok">↓</span></div>`).join(''):`<div class="hint">${t('noMissingMods')}</div>`;
  $('#crashLog').textContent=report.logTail||'Лог пуст или не найден.';
  $('#repairResult').textContent='';
  $('#crashFix').disabled=!report.suggestions?.length;
  $('#crashFix').textContent=t('repairBuild');
  if(!$('#crashDlg').open)$('#crashDlg').showModal();
}
api.on('crashReport',showCrashReport);
api.on('repairProgress',m=>{$('#repairResult').textContent=m});
$('#crashClose').onclick=async()=>{await api.call('clearCrash');$('#crashDlg').close()};
$('#crashFix').onclick=async()=>{
  const b=$('#crashFix');b.disabled=true;$('#repairResult').textContent=t('repairWorking');
  try{
    const result=await api.call('repair');
    const ok=result.installed.map(x=>x.id).join(', ');
    const bad=result.failed.map(x=>x.id+': '+x.error).join(' | ');
    $('#repairResult').textContent=(ok?t('repairDone')+ok+'. ':'')+(bad?t('repairSome')+bad:t('repairRestart'));
    b.textContent=result.allOk?'✓ '+t('repairDone'):t('repairBuild');
    have=new Set(await api.call('installed'));listMods();
  }catch(err){$('#repairResult').textContent=err.message;b.disabled=false}
};

/* установки */
function drawInst(){
  $('#instList').innerHTML=S.installs.map(i=>{
    const ok=have.has(i.version),d=busy===i.version;
    return `<div class="row ${i.id===S.sel?'cur':''}"><span class="cube"></span>
      <div><b>${esc(i.name)}</b><small>${esc(label(i))} · ${ok?`<span class="ok">${t('dled')}</span>`:t('notDled')}</small></div>
      <div class="act">${d?`<div class="mini"><div class="pbar"><i data-p="${esc(i.version)}" style="width:${Math.round((dlp[i.version]||0)*100)}%"></i></div></div>`
        :`${ok?'':`<button class="btn" data-a="dl" data-id="${esc(i.id)}">${t('download')}</button>`}
          <button class="btn g" data-a="play" data-id="${esc(i.id)}">${t('play')}</button>
          ${S.installs.length>1?`<button class="btn" data-a="del" data-id="${esc(i.id)}" title="${esc(t('unlist'))}">✕</button>`:''}`}</div></div>`}).join('');
}
$('#instList').onclick=async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const id=b.dataset.id;await pick(id);
  if(b.dataset.a==='dl')download(cur()).catch(()=>{});
  if(b.dataset.a==='play'){show('play');play()}
  if(b.dataset.a==='del'){const l=S.installs.filter(x=>x.id!==id);S=await api.call('select',{installs:l,sel:l[0].id});drawBar();drawInst()}
};
function fillVers(){
  const k=new Set(['release']);if($('#fSnap').checked)k.add('snapshot');if($('#fOld').checked){k.add('old_beta');k.add('old_alpha')}
  $('#nVer').innerHTML=V.filter(v=>k.has(v.type)).map(v=>`<option>${esc(v.id)}</option>`).join('');
}
$('#fSnap').onchange=$('#fOld').onchange=fillVers;
$('#newInst').onclick=()=>{$('#nName').value='';fillVers();$('#dlg').showModal()};
$('#nCancel').onclick=()=>$('#dlg').close();
$('#nCreate').onclick=async()=>{
  const i={id:'i'+Date.now().toString(36),name:$('#nName').value.trim()||t('untitled'),version:$('#nVer').value,loader:$('#nLdr').value};
  S=await api.call('select',{installs:[...S.installs,i],sel:i.id});$('#dlg').close();drawBar();drawInst();
  if(!have.has(i.version))download(i).catch(()=>{});
};

/* моды и ресурспаки */
const ctx=()=>$('#ctx').textContent=`${cur().name} (${kind==='mod'?label(cur()):cur().version})`;
$('#kind').onclick=e=>{const k=e.target.dataset.k;if(!k)return;kind=k;found=[];
  $$('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  $('#kt').textContent=t(k==='mod'?'modsT':'packsT');$('#q').placeholder=t(k==='mod'?'modPh':'packPh');ctx();listMods();search()};
$('#seg').onclick=e=>{const s=e.target.dataset.s;if(!s)return;src=s;$$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));search()};
$('#sbtn').onclick=()=>search();
$('#q').onkeydown=e=>{if(e.key==='Enter')search()};
function renderRes(){
  if(searching){$('#res').innerHTML=`<div class="empty">${t('searching')}</div>`;return}
  $('#res').innerHTML=found.length?found.map((m,i)=>`<div class="mod">${m.icon?`<img src="${esc(m.icon)}" alt="">`:'<div class="ph"></div>'}
    <div><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p><div class="meta">${esc(m.author)} · ${t('dlsN')}: ${fmt(m.downloads)}</div></div>
    <button class="btn g" data-n="${i}">${t('install')}</button></div>`).join(''):`<div class="empty">${t('notFound')}</div>`;
}
async function search(){
  searching=true;renderRes();
  try{found=await api.call('search',{src,kind,q:$('#q').value.trim()})}
  catch(e){found=[];toast(e.message,1)}
  searching=false;renderRes();
}
$('#res').onclick=async e=>{
  const b=e.target.closest('button[data-n]');if(!b)return;const m=found[b.dataset.n];
  b.disabled=true;b.textContent=t('dling');
  try{const f=await api.call('install',{src:m.src,id:m.id,kind});toast(t('installed')+': '+f.join(', ')+(kind==='resourcepack'?'. '+t('packHint'):''));b.textContent=t('installed');listMods()}
  catch(err){toast(err.message,1);b.disabled=false;b.textContent=t('install')}
};
async function listMods(){
  const l=await api.call('mods',kind);
  $('#modInst').innerHTML=l.length?l.map(f=>`<div class="inst"><span>${esc(f)}</span><button data-f="${esc(f)}">✕</button></div>`).join(''):`<div class="hint">${t('none')}</div>`;
}
$('#modInst').onclick=async e=>{const f=e.target.dataset.f;if(f){await api.call('remove',{kind,f});listMods()}};
$('#open').onclick=()=>api.call('folder');

/* настройки */
$('#save').onclick=async()=>{S=await api.call('set',{ram:+$('#ram').value||4});toast(t('saved'))};

(async()=>{
  S=await api.call('state');
  const bgName=/^wallpaper-[1-5]\.jpg$/.test(S.playBackground||'')?S.playBackground:'wallpaper-1.jpg';
  $('#v-play').style.backgroundImage=`url("assets/backgrounds/${bgName}")`;
  have=new Set(await api.call('installed'));JP=await api.call('javaPresets');
  $('#nick').value=S.nick;$('#ram').value=S.ram;$('#lang').value=S.lang;$('#jp').value=S.javaPreset||'default';$('#closeOn').checked=S.closeOnLaunch!==false;
  applyLang();drawAccounts();$('#log').textContent=t('ready');
  if(!S.accounts?.length || !S.onboardingComplete){$('#welcomeDlg').showModal()}
  else {const crash=await api.call('lastCrash');if(crash)showCrashReport(crash)}
  try{V=await api.call('versions')}catch{toast(t('noVers'),1)}
})();
</script>
</body>
</html>
